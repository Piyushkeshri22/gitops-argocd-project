# Number of Nginx replicas to run
replicaCount: 3

# Docker image configuration
image:
  repository: nginx
  tag: "1.27"
  pullPolicy: IfNotPresent

# Kubernetes Service configuration
service:
  type: NodePort
  port: 80
  nodePort: 30081

# Container resource allocation
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

# Container health checks
probes:
  readiness:
    enabled: true
    path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    path: /
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3
