apiVersion: v1
kind: Service

metadata:
  # Name generated using Helm fullname helper
  name: {{ include "nginx-chart.fullname" . }}
  labels:
    {{- include "nginx-chart.labels" . | nindent 4 }}

spec:
  # Service type is taken from values.yaml
  # Supported types include NodePort, ClusterIP and LoadBalancer
  type: {{ .Values.service.type }}

  # Must match the Deployment pod selector labels
  selector:
    {{- include "nginx-chart.selectorLabels" . | nindent 4 }}

  ports:
    # Service port exposed inside the cluster
    - port: {{ .Values.service.port }}

      # Port on which the Nginx container listens
      targetPort: {{ .Values.service.port }}

      # Communication protocol
      protocol: TCP

      # Render nodePort only when Service type is NodePort
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
