apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-alert-rules
  namespace: monitoring
  labels:
    release: monitoring

spec:
  groups:
    - name: kubernetes-pod-alerts
      rules:
        - alert: PodCrashLooping
          expr: |
            max_over_time(
              kube_pod_container_status_waiting_reason{
                reason="CrashLoopBackOff"
              }[5m]
            ) == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod is in CrashLoopBackOff"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping."

        - alert: PodPending
          expr: |
            kube_pod_status_phase{phase="Pending"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is stuck in Pending state"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been Pending for more than 5 minutes."

        - alert: PodNotReady
          expr: |
            kube_pod_status_ready{condition="true"} == 0
            unless on(namespace, pod)
            kube_pod_status_phase{phase="Succeeded"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod is not Ready"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has not been Ready for more than 5 minutes."

    - name: kubernetes-node-alerts
      rules:
        - alert: KubernetesNodeNotReady
          expr: |
            kube_node_status_condition{
              condition="Ready",
              status="true"
            } == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Kubernetes node is NotReady"
            description: "Node {{ $labels.node }} has been NotReady for more than 5 minutes."
